# AI-use log: one entry per AI-assisted activity (course deliverable D1, kept up to date).
# Maintained by humans; agents draft entries in their build reports.
#
# Entry fields:
#   id:          AIU-NNN, never reused
#   date:        YYYY-MM-DD, or the first and last day of the activity
#   member:      team member who supervised the activity (owner nickname)
#   purpose:     what the AI was asked to do
#   prompt:      the main instruction given to the AI, lightly edited for clarity
#   requirements: [REQ-NNN, ...] or []
#   artifacts:   files or PRs produced or changed
#   supervision: how the human checked or corrected the output
#   transcript:  path under transcripts/, or null
entries:
  - id: AIU-001
    date: "2026-11-10"
    member: AlchemyHAN
    purpose: >-
      Check whether the reported problem exists in our code base and draft requirements for it.
    prompt: >-
      Our team is improving Open Deep Research. My assignment is the problem that some sub-agent
      failures are not reported and the run goes straight to "research complete" (upstream issues
      #283 and #284). Confirm whether this problem exists and is reasonable to address, design the
      requirement, and write it as YAML that follows req-schema.json.
    requirements: [REQ-002, REQ-004]
    artifacts:
      - docs/req/requirements.yaml
    supervision: >-
      The AI reproduced the defect with offline probes against the current code. The member
      reviewed the draft, compared it with teammates' requirements to find overlaps, and decided
      how responsibilities were split.
    transcript: null

  - id: AIU-002
    date: "2026-11-11"
    member: AlchemyHAN
    purpose: >-
      Consolidate the team's merged requirements into one consistent, schema-valid set.
    prompt: >-
      We have merged the team's requirements.yaml, but it still contains conflicts,
      inconsistencies, formatting problems and uneven levels of detail; some parts are imprecise
      or incomplete and others are redundant. Revise it as a whole: remove redundancy, split or
      merge coupled requirements, resolve conflicts, and renumber the requirements from REQ-001.
    requirements: [REQ-001, REQ-002, REQ-003, REQ-004, REQ-005, REQ-006, REQ-007, REQ-008, REQ-009, REQ-010]
    artifacts:
      - docs/req/requirements.yaml
      - docs/req/req-schema.json
    supervision: >-
      Claims in each requirement were checked against the source code and upstream issues. The
      member supplied the owners' nicknames, reviewed the result, removed revision-history notes,
      and approved all ten requirements for the team.
    transcript: null

  - id: AIU-003
    date: "2026-11-11"
    member: AlchemyHAN
    purpose: >-
      Place the team's governance documents in the repository and turn them into one consistent
